name: elimu_app
description: "ElimuApp - Learning Made Easy for Every Child"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # UI Components
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.2
  firebase_storage: ^12.3.8
  google_sign_in: ^6.2.2

  # State Management
  provider: ^6.1.2

  # Local Storage
  shared_preferences: ^2.3.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # Video Player
  video_player: ^2.9.2
  chewie: ^1.8.5

  # PDF Viewer
  flutter_pdfview: ^1.3.3

  # File Download
  dio: ^5.7.0
  permission_handler: ^11.3.1

  # Icons
  font_awesome_flutter: ^10.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/icons/
    - assets/images/
    - assets/sample_pdfs/
    - assets/sample_videos/
    - data/grade6.json
    - data/grade7.json
    - data/grade8.json
    - data/grade9.json

  # Fonts - Using system default fonts
  # To add custom fonts, download font files and place them in assets/fonts/
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/Poppins-SemiBold.ttf
  #         weight: 600
